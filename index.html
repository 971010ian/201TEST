<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>線上擲骰子</title>
    <style>
      body {
        background: #f2f6ff;
        color: #222;
        font-family: "Noto Sans TC", "Segoe UI", Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        padding: 32px;
        width: min(420px, 90vw);
        text-align: center;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 2rem;
      }
      .dice {
        font-size: 6rem;
        margin: 24px 0;
        display: inline-block;
        width: 140px;
        height: 140px;
        line-height: 140px;
        border-radius: 24px;
        background: linear-gradient(180deg, #4a90e2 0%, #2f6ccf 100%);
        color: white;
        box-shadow: 0 18px 35px rgba(46, 78, 150, 0.35);
      }
      button {
        background: #4a90e2;
        border: none;
        border-radius: 999px;
        color: white;
        cursor: pointer;
        font-size: 1rem;
        padding: 14px 24px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(74, 144, 226, 0.3);
      }
      .result {
        margin-top: 18px;
        font-size: 1rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>擲骰子遊戲</h1>
      <div class="dice" id="diceFace">1</div>
      <div>
        <button id="rollButton">擲骰子</button>
      </div>
      <div class="result" id="resultText">按下「擲骰子」來開始。</div>
    </div>
    <script>
      const diceFace = document.getElementById('diceFace');
      const resultText = document.getElementById('resultText');
      const rollButton = document.getElementById('rollButton');

      function rollDice() {
        const value = Math.floor(Math.random() * 6) + 1;
        const faces = {
          1: '⚀',
          2: '⚁',
          3: '⚂',
          4: '⚃',
          5: '⚄',
          6: '⚅'
        };

        diceFace.textContent = faces[value];
        resultText.textContent = `你擲出的點數是 ${value}。`;
      }

      rollButton.addEventListener('click', rollDice);
    </script>
  </body>
</html>
